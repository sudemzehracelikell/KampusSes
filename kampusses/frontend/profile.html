<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - KampüsSes</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="navbar-brand">KampüsSes</a>
            <ul class="navbar-menu" id="navbarMenu"></ul>
        </div>
    </nav>

    <div class="container" style="padding-top: var(--space-2xl); padding-bottom: var(--space-3xl);">
        <div class="glass-card" style="margin-bottom: var(--space-2xl);" id="profileCard"></div>

        <h2 style="margin-bottom: var(--space-lg);">Bildirimlerim</h2>
        <div class="grid grid-cols-3" id="myReports"></div>
        <div id="paginationContainer"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="components.js"></script>
    <script>
        let page = 1;

        async function init() {
            try {
                const me = await api.me();
                auth.updateUser(me);
                document.getElementById('profileCard').innerHTML = `
                    <div class="flex items-center gap-lg" style="flex-wrap: wrap;">
                        <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--gradient-primary);
                                    display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700;">
                            ${escapeHtml(me.username.charAt(0).toUpperCase())}
                        </div>
                        <div>
                            <h1 style="margin-bottom: var(--space-xs);">${escapeHtml(me.username)}</h1>
                            <p class="text-secondary">${escapeHtml(me.email)}</p>
                            <span class="badge ${getRoleBadgeClass(me.role)}">${escapeHtml(me.role_display)}</span>
                            <span class="text-muted" style="margin-left: var(--space-sm);">Üyelik: ${new Date(me.date_joined).toLocaleDateString('tr-TR')}</span>
                        </div>
                    </div>`;
            } catch (error) {
                showToast(error.message, 'error');
            }
            loadReports();
        }

        async function loadReports() {
            try {
                const data = await api.getReports({ mine: 'true', page });
                renderReportGrid(document.getElementById('myReports'), document.getElementById('paginationContainer'), data, {
                    page, emptyMessage: 'Henüz bildiriminiz yok.', onPageChange: p => { page = p; loadReports(); },
                });
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        if (auth.requireAuth()) init();
    </script>
</body>

</html>
